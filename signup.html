<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Listing Optimization AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #171838 0%, #202149 100%);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .auth-page::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(178, 34, 52, 0.15), transparent 66%);
      border-radius: 50%;
    }

    .auth-card {
      background: #fff;
      padding: 48px;
      border-radius: 12px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 24px 70px rgba(22, 23, 55, 0.12);
      position: relative;
      z-index: 1;
    }

    .auth-card .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      font-size: 10px;
      line-height: 1.15;
      letter-spacing: .03em;
      color: var(--ink);
    }

    .auth-card .brand strong {
      font-size: 12px;
    }

    .auth-card .brand-mark {
      display: flex;
      align-items: end;
      gap: 2px;
      width: 27px;
      height: 28px;
      padding: 5px;
      border: 1px solid rgba(23, 24, 56, 0.3);
      border-radius: 5px;
    }

    .auth-card .brand-mark i {
      display: block;
      width: 4px;
      background: var(--red);
      border-radius: 1px;
    }

    .auth-card .brand-mark i:nth-child(1) { height: 8px; }
    .auth-card .brand-mark i:nth-child(2) { height: 16px; background: var(--ink); }
    .auth-card .brand-mark i:nth-child(3) { height: 12px; background: #c8b100; }

    .auth-card h1 {
      font-size: 32px;
      margin: 0 0 8px;
      letter-spacing: -0.05em;
      color: var(--ink);
    }

    .auth-subtitle {
      color: var(--muted);
      margin: 0 0 32px;
      font-size: 14px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-form input {
      padding: 14px 16px;
      border: 1px solid #e5e4e9;
      border-radius: 7px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .auth-form input:focus {
      outline: none;
      border-color: var(--red);
    }

    .auth-form .btn {
      width: 100%;
      margin-top: 8px;
    }

    .auth-divider {
      text-align: center;
      margin: 24px 0;
      position: relative;
    }

    .auth-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e5e4e9;
    }

    .auth-divider span {
      background: #fff;
      padding: 0 16px;
      position: relative;
      color: var(--muted);
      font-size: 12px;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid #e5e4e9;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
      font-family: inherit;
    }

    .google-btn:hover {
      background: #f5f4f0;
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }

    .auth-footer a {
      color: var(--red);
      font-weight: 600;
    }

    .auth-error {
      background: #fef2f2;
      color: #dc2626;
      padding: 12px;
      border-radius: 7px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      border: 1px solid #fecaca;
    }

    .auth-success {
      background: #f0fdf4;
      color: #16a34a;
      padding: 12px;
      border-radius: 7px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="brand">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span>Listing<br><strong>Optimization AI</strong></span>
      </a>

      <h1>Create an account</h1>
      <p class="auth-subtitle">Start your free trial</p>

      <div id="auth-error" class="auth-error"></div>
      <div id="auth-success" class="auth-success"></div>

      <form id="signup-form" class="auth-form">
        <input type="text" id="name" placeholder="Full name" required autocomplete="name">
        <input type="email" id="email" placeholder="Email address" required autocomplete="email">
        <input type="password" id="password" placeholder="Password" required autocomplete="new-password" minlength="6">
        <button type="submit" class="btn btn-primary">Get Started Free</button>
      </form>

      <div class="auth-divider">
        <span>or</span>
      </div>

      <button id="google-signup" class="google-btn" type="button">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.03 2.53-2.18 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-1 7.28-2.69l-3.57-2.77c-.99.66-2.26 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <p class="auth-footer">
        Already have an account? <a href="/login.html">Log in</a>
      </p>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    function showError(message) {
      const errorEl = document.getElementById('auth-error');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
      document.getElementById('auth-success').style.display = 'none';
    }

    function showSuccess(message) {
      const successEl = document.getElementById('auth-success');
      successEl.textContent = message;
      successEl.style.display = 'block';
      document.getElementById('auth-error').style.display = 'none';
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const result = await Auth.signup(email, password, name);

      if (result.success) {
        showSuccess('Account created. Check your email to verify it, then sign in.');
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1800);
      } else {
        showError(result.error);
      }
    });

    document.getElementById('google-signup').addEventListener('click', async () => {
      const result = await Auth.signInWithGoogle();

      if (result.success) {
        showSuccess('Account created! Redirecting...');
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1000);
      } else {
        showError(result.error);
      }
    });

    Auth.onAuthStateChanged((user) => {
      if (user?.emailVerified && window.location.pathname === '/signup.html') {
        window.location.href = '/dashboard.html';
      }
    });
  </script>
</body>
</html>
